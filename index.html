<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Scheduler</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

    <style>
        #calendar {
            max-width: 100%;
            height: 600px;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        .fc-theme-standard .fc-scrollgrid {
            border-color: #e5e7eb;
        }

        .fc-button-primary {
            background-color: #3b82f6 !important;
            border-color: #3b82f6 !important;
        }

        .fc-button-primary:hover {
            background-color: #2563eb !important;
        }

        .fc-event-title,
        .fc-event-main,
        .fc-list-event-title {
            white-space: normal !important;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .fc-daygrid-event {
            white-space: normal !important;
        }

        .fc-event {
            cursor: pointer;
            transition: filter 0.15s ease, box-shadow 0.15s ease;
        }

        .fc-event:hover {
            filter: brightness(0.9);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 p-6">

    <div class="max-w-5xl mx-auto space-y-6">

        <header class="text-center">
            <h1 class="text-3xl font-bold text-gray-900">
                AI Smart Scheduler
            </h1>

            <p class="text-gray-500 mt-2">
                Describe your plans naturally, and the AI will add them to your calendar.
            </p>
        </header>

        <!-- Input Section -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">

            <label for="promptInput" class="block text-sm font-medium text-gray-700 mb-2">
                What do you have planned?
                (e.g., "Team meeting tomorrow from 2pm to 3pm")
            </label>

            <textarea id="promptInput" rows="3" class="w-full border-gray-300 rounded-lg shadow-sm
                       focus:ring-blue-500 focus:border-blue-500
                       p-3 border resize-none" placeholder="Type your activities here...">
            </textarea>

            <div class="mt-4 flex items-center justify-between">

                <span id="statusMessage" class="text-sm font-medium text-blue-600 hidden">
                    Processing with Gemini...
                </span>

                <div class="ml-auto flex space-x-3">
                    <button id="micBtn" type="button" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-lg font-medium hover:bg-gray-300 transition focus:outline-none">
                        Speech to Text
                    </button>

                    <button id="exportBtn" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium hover:bg-emerald-700 transition focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2">
                        Export to .ics
                    </button>
                    <button id="submitBtn" class="bg-blue-600 text-white px-6 py-2
                               rounded-lg font-medium hover:bg-blue-700
                               transition focus:outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:ring-offset-2">
                        Add to Calendar
                    </button>
                </div>

            </div>
        </div>

        <!-- Calendar -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <div id="calendar"></div>
        </div>

    </div>

<script>
    let calendar;
    const eventColors = [
        { backgroundColor: '#2563eb', borderColor: '#1d4ed8', textColor: '#ffffff' },
        { backgroundColor: '#16a34a', borderColor: '#15803d', textColor: '#ffffff' },
        { backgroundColor: '#ea580c', borderColor: '#c2410c', textColor: '#ffffff' },
        { backgroundColor: '#9333ea', borderColor: '#7e22ce', textColor: '#ffffff' },
        { backgroundColor: '#db2777', borderColor: '#be185d', textColor: '#ffffff' },
        { backgroundColor: '#0891b2', borderColor: '#0e7490', textColor: '#ffffff' }
    ];

    function getRandomEventColor() {
        return eventColors[Math.floor(Math.random() * eventColors.length)];
    }

    // Helper functions for LocalStorage
    function saveEvents() {
        const events = calendar.getEvents().map(event => ({
            title: event.title,
            start: event.startStr,
            end: event.endStr,
            allDay: event.allDay,
            backgroundColor: event.backgroundColor,
            borderColor: event.borderColor,
            textColor: event.textColor
        }));

        localStorage.setItem("calendarEvents", JSON.stringify(events));
    }

    function loadEvents() {
        const savedEvents = localStorage.getItem("calendarEvents");
        if (!savedEvents) return [];

        try {
            return JSON.parse(savedEvents).map(event => ({
                ...event,
                ...(event.backgroundColor ? {} : getRandomEventColor())
            }));
        } catch (error) {
            console.error("Could not load saved events:", error);
            return [];
        }
    }

    // Initialize Calendar once DOM is ready
    document.addEventListener('DOMContentLoaded', function () {
        const calendarEl = document.getElementById('calendar');
        const savedEvents = loadEvents();

        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'timeGridWeek',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'dayGridMonth,timeGridWeek,timeGridDay'
            },
            events: savedEvents,
            editable: true,
            selectable: true,
            nowIndicator: true,
            scrollTime: '07:00:00',

            // Delete event on click
            eventClick: function (info) {
                if (confirm(`Delete the event: "${info.event.title}"?`)) {
                    info.event.remove(); // Triggers eventRemove callback below
                }
            },

            // Save changes to LocalStorage
            eventChange: function () {
                saveEvents();
            },
            eventRemove: function () {
                saveEvents();
            }
        });

        calendar.render();
    });

    // Handle ICS Export
    document.getElementById('exportBtn').addEventListener('click', () => {
        const events = calendar.getEvents();
        if (events.length === 0) {
            alert("No events to export!");
            return;
        }

        const formatICalDate = (date) => {
            return date.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
        };

        let icsContent = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//AI Smart Scheduler//EN'
        ];

        events.forEach(event => {
            const start = event.start ? formatICalDate(new Date(event.start)) : '';
            const end = event.end 
                ? formatICalDate(new Date(event.end)) 
                : formatICalDate(new Date(new Date(event.start).getTime() + 30 * 60000));

            icsContent.push('BEGIN:VEVENT');
            icsContent.push(`SUMMARY:${event.title}`);
            icsContent.push(`DTSTART:${start}`);
            icsContent.push(`DTEND:${end}`);
            icsContent.push(`UID:${Math.random().toString(36).substring(2)}@aischeduler.local`);
            icsContent.push('END:VEVENT');
        });

        icsContent.push('END:VCALENDAR');

        const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'my-schedule.ics';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    });

    // ==========================================
    // SPEECH TO TEXT LOGIC
    // ==========================================
    const micBtn = document.getElementById('micBtn');
    const inputField = document.getElementById('promptInput');

    // Cross-browser support for Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.continuous = false; // Stops listening automatically when you pause
        recognition.interimResults = false;

        // UI changes when listening starts
        recognition.onstart = function() {
            micBtn.textContent = 'Listening...';
            micBtn.classList.remove('bg-gray-200', 'text-gray-700');
            micBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
        };

        // When speech is successfully converted to text
        recognition.onresult = function(event) {
            const transcript = event.results[0][0].transcript;
            // Add space before appending if the box already has text
            inputField.value += (inputField.value.trim() ? ' ' : '') + transcript;
        };

        // Revert UI when listening stops
        recognition.onend = function() {
            micBtn.textContent = '🎤 Speak';
            micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
            micBtn.classList.add('bg-gray-200', 'text-gray-700');
        };

        recognition.onerror = function(event) {
            console.error("Microphone error:", event.error);
            alert("Microphone error: " + event.error);
        };

        // Start listening on click
        micBtn.addEventListener('click', () => {
            recognition.start();
        });
    } else {
        // Hide button if the browser doesn't support the API
        micBtn.style.display = 'none';
        console.warn("Speech Recognition API not supported in this browser.");
    }

    // Handle Form Submission
    document.getElementById('submitBtn').addEventListener('click', async () => {
        const inputField = document.getElementById('promptInput');
        const statusMessage = document.getElementById('statusMessage');
        const promptText = inputField.value.trim();

        if (!promptText) {
            return alert("Please enter an activity first.");
        }

        statusMessage.classList.remove('hidden');
        statusMessage.textContent = 'Processing with Gemini...';
        statusMessage.className = 'text-sm font-medium text-blue-600';
        document.getElementById('submitBtn').disabled = true;

        try {
            const now = new Date();
            const userTimeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const localDateString = now.toString();
            const currentEvents = calendar.getEvents().map(e => ({
                title: e.title,
                start: e.startStr,
                end: e.endStr,
                allDay: e.allDay
            }));

            const response = await fetch('/api/schedule', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    promptText: promptText,
                    currentDate: localDateString,
                    timeZone: userTimeZone,
                    existingEvents: currentEvents
                })
            });

            if (!response.ok) {
                throw new Error(`Server Error: ${response.status}`);
            }

            const events = await response.json();

            events.forEach(event => {
                const color = getRandomEventColor();
                calendar.addEvent({
                    title: event.title,
                    start: event.start,
                    end: event.end,
                    allDay: event.allDay,
                    ...color
                });
            });

            saveEvents();

            statusMessage.textContent = `Successfully added ${events.length} event(s)!`;
            statusMessage.className = 'text-sm font-medium text-green-600';
            inputField.value = '';

        } catch (error) {
            console.error(error);
            statusMessage.textContent = 'Error processing request. Check console.';
            statusMessage.className = 'text-sm font-medium text-red-600';
        } finally {
            statusMessage.classList.remove('hidden');
            document.getElementById('submitBtn').disabled = false;

            setTimeout(() => {
                statusMessage.classList.add('hidden');
            }, 3000);
        }
    });
</script>

</body>

</html>
